<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" fill="none">
  <!-- Tantie - Pose B: Dynamic Rhythm Pop -->
  <g class="character-tantie pose-b">
    <!-- Shadow (bouncing, slightly smaller) -->
    <ellipse cx="120" cy="305" rx="50" ry="9" fill="#000000" fill-opacity="0.3"/>
    
    <!-- Feet / Sandals (raised on toes/heels) -->
    <path d="M86 284 C81 284 76 291 79 298 C82 301 100 301 101 296 C101 290 92 284 86 284 Z" fill="#D97706" stroke="#18181B" stroke-width="2.5"/>
    <path d="M152 284 C147 284 142 291 145 298 C148 301 166 301 167 296 C167 290 158 284 152 284 Z" fill="#D97706" stroke="#18181B" stroke-width="2.5"/>
    
    <!-- Legs (slight bounce bent) -->
    <path d="M96 236 L92 288" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
    <path d="M144 236 L148 288" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Kaba / Boubou Dress (swayed slightly right) -->
    <path d="M80 142 C68 172 65 212 60 246 C85 254 165 254 190 246 C182 212 176 172 160 142 Z" fill="#536D56" stroke="#18181B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Wax Print Geometric Patterns -->
    <path d="M75 186 Q122 198 172 186" stroke="#FACC15" stroke-width="4" stroke-dasharray="8 6"/>
    <path d="M68 221 Q122 234 180 221" stroke="#F43F5E" stroke-width="4" stroke-dasharray="10 6"/>
    <circle cx="122" cy="170" r="9" fill="#FACC15" stroke="#18181B" stroke-width="2"/>
    <circle cx="100" cy="210" r="7" fill="#F43F5E" stroke="#18181B" stroke-width="2"/>
    <circle cx="150" cy="210" r="7" fill="#F43F5E" stroke="#18181B" stroke-width="2"/>

    <!-- Left Arm Raised High (Dance pump) -->
    <path d="M80 144 Q52 115 45 88 Q55 80 64 92" fill="none" stroke="#6B4423" stroke-width="13" stroke-linecap="round"/>
    <path d="M80 144 Q52 115 45 88 Q55 80 64 92" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Bangle -->
    <circle cx="48" cy="100" r="7" fill="none" stroke="#FACC15" stroke-width="3.5"/>

    <!-- Right Arm Raised High (Dance pump) -->
    <path d="M160 144 Q188 115 195 88 Q185 80 176 92" fill="none" stroke="#6B4423" stroke-width="13" stroke-linecap="round"/>
    <path d="M160 144 Q188 115 195 88 Q185 80 176 92" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Bangle -->
    <circle cx="192" cy="100" r="7" fill="none" stroke="#FACC15" stroke-width="3.5"/>

    <!-- Neck -->
    <path d="M110 118 L110 145 L130 145 L130 118 Z" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
    <!-- Beaded Necklace -->
    <path d="M106 138 Q120 150 134 138" fill="none" stroke="#F43F5E" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Head / Face (tilted +4 deg) -->
    <g transform="rotate(4 120 95)">
      <circle cx="120" cy="95" r="32" fill="#6B4423" stroke="#18181B" stroke-width="3"/>
      
      <!-- Ears & Gold Hoop Earrings swinging -->
      <circle cx="88" cy="97" r="7" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
      <circle cx="82" cy="107" r="9" fill="none" stroke="#FACC15" stroke-width="3"/>
      <circle cx="152" cy="97" r="7" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
      <circle cx="158" cy="107" r="9" fill="none" stroke="#FACC15" stroke-width="3"/>

      <!-- Eyes (Excited winking / cheering) -->
      <path d="M104 94 Q109 88 114 94" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="132" cy="91" rx="4.5" ry="6" fill="#18181B"/>
      <circle cx="133.5" cy="89" r="1.8" fill="#FFFFFF"/>

      <!-- Eyebrows (high joyful arches) -->
      <path d="M102 79 Q109 74 116 80" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M125 78 Q132 73 139 79" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M117 96 Q120 101 123 96" fill="none" stroke="#42250E" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Wide Open Laughing Smile -->
      <path d="M106 105 Q120 126 134 105 Z" fill="#E11D48" stroke="#18181B" stroke-width="2.5"/>
      <path d="M109 105 Q120 113 131 105" fill="#FFFFFF"/>

      <!-- Cheek Blush -->
      <ellipse cx="98" cy="101" rx="4" ry="2.5" fill="#F43F5E" fill-opacity="0.5"/>
      <ellipse cx="142" cy="101" rx="4" ry="2.5" fill="#F43F5E" fill-opacity="0.5"/>

      <!-- Headwrap / Gele (African Fabric) -->
      <path d="M88 81 C85 47 100 32 120 32 C140 32 155 47 152 81 C158 72 168 57 162 45 C150 21 90 21 78 45 C72 57 82 72 88 81 Z" fill="#FACC15" stroke="#18181B" stroke-width="3" stroke-linejoin="round"/>
      <!-- Gele Fan Knot Top -->
      <path d="M105 35 C95 15 145 15 135 35 Z" fill="#F43F5E" stroke="#18181B" stroke-width="2.5"/>
      <path d="M92 62 Q120 49 148 62" stroke="#059669" stroke-width="3.5"/>
      <circle cx="120" cy="45" r="4" fill="#536D56"/>
    </g>
  </g>
</svg>