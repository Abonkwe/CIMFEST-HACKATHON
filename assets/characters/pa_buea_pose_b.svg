    <!-- Tailored Trousers (slight knee lift) -->
    <path d="M86 210 L80 288 L98 288 L108 220 Z" fill="#334155" stroke="#18181B" stroke-width="2.5"/>
    <path d="M154 210 L162 284 L144 284 L132 220 Z" fill="#334155" stroke="#18181B" stroke-width="2.5"/>

