      <path d="M110 102 Q120 118 130 102 Z" fill="#E11D48" stroke="#18181B" stroke-width="2"/>
      <rect x="117" y="102" width="3" height="3" fill="#F59E0B"/>

      <!-- Buea Vintage Flat Ivy Cap / Beret -->
      <path d="M86 72 C80 44 140 39 158 62 C164 68 150 76 86 72 Z" fill="#78350F" stroke="#18181B" stroke-width="2.8"/>
      <path d="M92 72 C115 78 150 74 156 68" fill="none" stroke="#451A03" stroke-width="4" stroke-linecap="round"/>
      <circle cx="122" cy="48" r="3" fill="#451A03"/>
