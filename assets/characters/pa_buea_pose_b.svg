    <path d="M78 134 Q62 118 56 102" stroke="#0369A1" stroke-width="14" stroke-linecap="round"/>

    <!-- Right Arm (Swinging cane up in the air!) -->
    <path d="M162 136 Q192 115 198 88" fill="none" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
    <path d="M162 136 Q192 115 198 88" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M162 134 Q178 118 185 102" stroke="#0369A1" stroke-width="14" stroke-linecap="round"/>
    <circle cx="198" cy="88" r="6" fill="#6B4423" stroke="#18181B" stroke-width="2"/>

