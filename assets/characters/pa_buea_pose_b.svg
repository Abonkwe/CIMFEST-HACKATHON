      <path d="M130 85 Q134 80 138 85" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Eyebrows (Wisdom Gray high) -->
      <path d="M98 71 Q106 66 114 71" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
      <path d="M126 71 Q134 66 142 71" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

