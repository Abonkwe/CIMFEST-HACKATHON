    <rect x="112" y="112" width="16" height="24" fill="#6B4423" stroke="#18181B" stroke-width="2"/>

    <!-- Head (tilted +5 deg) -->
    <g transform="rotate(5 120 88)">
      <circle cx="120" cy="88" r="30" fill="#6B4423" stroke="#18181B" stroke-width="3"/>
      
      <!-- Ears -->
      <circle cx="90" cy="89" r="6.5" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
      <circle cx="150" cy="89" r="6.5" fill="#6B4423" stroke="#18181B" stroke-width="2"/>

      <!-- Round Wireframe Glasses (Wise Elder) -->
      <circle cx="106" cy="84" r="10" fill="#FFFFFF" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2.2"/>
      <circle cx="134" cy="84" r="10" fill="#FFFFFF" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2.2"/>
      <line x1="116" y1="84" x2="124" y2="84" stroke="#F59E0B" stroke-width="2.2"/>
      <line x1="96" y1="84" x2="90" y2="87" stroke="#F59E0B" stroke-width="1.8"/>
      <line x1="144" y1="84" x2="150" y2="87" stroke="#F59E0B" stroke-width="1.8"/>

