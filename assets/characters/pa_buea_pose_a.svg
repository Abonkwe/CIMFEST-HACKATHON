<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" fill="none">
  <!-- Pa Buea - Pose A: Elegant Makossa Elder Stance -->
  <g class="character-pa-buea pose-a">
    <!-- Floor Shadow -->
    <ellipse cx="120" cy="305" rx="56" ry="10" fill="#000000" fill-opacity="0.28"/>
    
    <!-- Vintage Dress Shoes (Brown Leather) -->
    <path d="M82 292 C78 290 74 298 78 303 C82 306 98 306 100 300 C100 295 90 292 82 292 Z" fill="#451A03" stroke="#18181B" stroke-width="2.5"/>
    <path d="M142 292 C138 290 134 298 138 303 C142 306 158 306 160 300 C160 295 150 292 142 292 Z" fill="#451A03" stroke="#18181B" stroke-width="2.5"/>
    
    <!-- Cane Tip on Ground -->
    <ellipse cx="180" cy="304" rx="4" ry="2" fill="#78350F" stroke="#18181B" stroke-width="1.5"/>

    <!-- Tailored Trousers -->
    <path d="M86 215 L82 294 L100 294 L108 225 Z" fill="#334155" stroke="#18181B" stroke-width="2.5"/>
    <path d="M154 215 L158 294 L140 294 L132 225 Z" fill="#334155" stroke="#18181B" stroke-width="2.5"/>

    <!-- Walking Stick / Cane Shaft -->
    <line x1="180" y1="304" x2="175" y2="185" stroke="#92400E" stroke-width="5" stroke-linecap="round"/>
    <!-- Gold Cane Handle -->
    <path d="M175 185 C175 178 185 174 190 180" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>

    <!-- Elegant Traditional Tunic / Shirt (Buea Royal Blue) -->
    <path d="M78 140 C70 170 72 215 76 230 C95 235 145 235 164 230 C168 215 170 170 162 140 Z" fill="#0369A1" stroke="#18181B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Gold Embroidered Placket & Buttons -->
    <rect x="117" y="140" width="6" height="55" fill="#FACC15" stroke="#B45309" stroke-width="1"/>
    <circle cx="120" cy="150" r="2" fill="#451A03"/>
    <circle cx="120" cy="165" r="2" fill="#451A03"/>
    <circle cx="120" cy="180" r="2" fill="#451A03"/>
    <!-- Traditional Embroidery Lines -->
    <path d="M98 165 Q120 175 142 165" stroke="#FACC15" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Left Arm (Hand gesturing / snapping Makossa rhythm) -->
    <path d="M78 142 Q52 170 56 195 Q64 202 70 192" fill="none" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
    <path d="M78 142 Q52 170 56 195 Q64 202 70 192" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M78 140 Q64 158 60 175" stroke="#0369A1" stroke-width="14" stroke-linecap="round"/>

    <!-- Right Arm (Grip on gold cane) -->
    <path d="M162 142 Q185 162 176 182" fill="none" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
    <path d="M162 142 Q185 162 176 182" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M162 140 Q175 158 174 175" stroke="#0369A1" stroke-width="14" stroke-linecap="round"/>
    <circle cx="175" cy="182" r="6" fill="#6B4423" stroke="#18181B" stroke-width="2"/>

    <!-- Neck -->
    <rect x="112" y="118" width="16" height="24" fill="#6B4423" stroke="#18181B" stroke-width="2"/>

    <!-- Head -->
    <circle cx="120" cy="94" r="30" fill="#6B4423" stroke="#18181B" stroke-width="3"/>
    
    <!-- Ears -->
    <circle cx="90" cy="95" r="6.5" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
    <circle cx="150" cy="95" r="6.5" fill="#6B4423" stroke="#18181B" stroke-width="2"/>

    <!-- Round Wireframe Glasses (Wise Elder) -->
    <circle cx="106" cy="90" r="10" fill="#FFFFFF" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2.2"/>
    <circle cx="134" cy="90" r="10" fill="#FFFFFF" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2.2"/>
    <line x1="116" y1="90" x2="124" y2="90" stroke="#F59E0B" stroke-width="2.2"/>
    <!-- Glasses Temples -->
    <line x1="96" y1="90" x2="90" y2="93" stroke="#F59E0B" stroke-width="1.8"/>
    <line x1="144" y1="90" x2="150" y2="93" stroke="#F59E0B" stroke-width="1.8"/>

    <!-- Kind Eyes behind spectacles -->
    <ellipse cx="106" cy="90" rx="3" ry="4" fill="#18181B"/>
    <circle cx="107" cy="89" r="1.2" fill="#FFFFFF"/>
    <ellipse cx="134" cy="90" rx="3" ry="4" fill="#18181B"/>
    <circle cx="135" cy="89" r="1.2" fill="#FFFFFF"/>

    <!-- Character Eyebrows (Wisdom Gray) -->
    <path d="M98 77 Q106 72 114 77" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <path d="M126 77 Q134 72 142 77" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M117 96 Q120 102 123 96" stroke="#451A03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Silver Mustache & Goatee (Authentic Buea Pa) -->
    <path d="M106 104 Q120 102 134 104 Q120 114 106 104 Z" fill="#E2E8F0" stroke="#18181B" stroke-width="1.8"/>
    <!-- Goatee on chin -->
    <path d="M115 116 Q120 126 125 116 Z" fill="#E2E8F0" stroke="#18181B" stroke-width="1.5"/>

    <!-- Warm Smile under Mustache -->
    <path d="M112 110 Q120 115 128 110" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>

    <!-- Buea Vintage Flat Ivy Cap / Beret -->
    <path d="M86 78 C80 50 140 45 158 68 C164 74 150 82 86 78 Z" fill="#78350F" stroke="#18181B" stroke-width="2.8"/>
    <!-- Cap Brim -->
    <path d="M92 78 C115 84 150 80 156 74" fill="none" stroke="#451A03" stroke-width="4" stroke-linecap="round"/>
    <!-- Little Button on Top -->
    <circle cx="122" cy="54" r="3" fill="#451A03"/>
  </g>
</svg>