<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" fill="none">
  <!-- Tantie - Pose A: Groove Stance -->
  <g class="character-tantie pose-a">
    <!-- Shadow -->
    <ellipse cx="120" cy="305" rx="55" ry="10" fill="#000000" fill-opacity="0.25"/>
    
    <!-- Feet / Sandals -->
    <path d="M90 288 C85 288 80 295 82 302 C84 305 102 305 104 300 C104 294 96 288 90 288 Z" fill="#D97706" stroke="#18181B" stroke-width="2.5"/>
    <path d="M148 288 C143 288 138 295 140 302 C142 305 160 305 162 300 C162 294 154 288 148 288 Z" fill="#D97706" stroke="#18181B" stroke-width="2.5"/>
    
    <!-- Legs -->
    <path d="M96 240 L94 292" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
    <path d="M144 240 L146 292" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Kaba / Boubou Dress (Vibrant wax print) -->
    <path d="M80 145 C65 175 60 215 55 250 C80 258 160 258 185 250 C180 215 175 175 160 145 Z" fill="#536D56" stroke="#18181B" stroke-width="3" stroke-linejoin="round"/>
