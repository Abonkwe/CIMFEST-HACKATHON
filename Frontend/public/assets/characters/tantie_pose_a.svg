    <circle cx="145" cy="215" r="7" fill="#F43F5E" stroke="#18181B" stroke-width="2"/>

    <!-- Left Arm (Dancer pose, bent left) -->
    <path d="M80 148 Q50 170 48 195 Q54 205 65 198" fill="none" stroke="#6B4423" stroke-width="13" stroke-linecap="round"/>
    <path d="M80 148 Q50 170 48 195 Q54 205 65 198" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Bangle -->
    <circle cx="50" cy="190" r="7" fill="none" stroke="#FACC15" stroke-width="3.5"/>

    <!-- Right Arm (Hand on hip) -->
    <path d="M160 148 Q188 170 178 195 Q168 200 162 190" fill="none" stroke="#6B4423" stroke-width="13" stroke-linecap="round"/>
    <path d="M160 148 Q188 170 178 195 Q168 200 162 190" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Bangle -->
    <circle cx="176" cy="190" r="7" fill="none" stroke="#FACC15" stroke-width="3.5"/>

    <!-- Neck -->
    <path d="M110 120 L110 148 L130 148 L130 120 Z" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
    <!-- Beaded Necklace -->
    <path d="M106 140 Q120 152 134 140" fill="none" stroke="#F43F5E" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Head / Face -->
    <circle cx="120" cy="98" r="32" fill="#6B4423" stroke="#18181B" stroke-width="3"/>
    
    <!-- Ears & Gold Hoop Earrings -->
    <circle cx="88" cy="100" r="7" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
    <circle cx="84" cy="108" r="9" fill="none" stroke="#FACC15" stroke-width="3"/>
    <circle cx="152" cy="100" r="7" fill="#6B4423" stroke="#18181B" stroke-width="2"/>
    <circle cx="156" cy="108" r="9" fill="none" stroke="#FACC15" stroke-width="3"/>

    <!-- Eyes (Joyful wide open) -->
    <ellipse cx="108" cy="94" rx="4" ry="5.5" fill="#18181B"/>
    <circle cx="109.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
    <!-- Eyelashes -->
    <path d="M104 88 L102 85 M108 86 L108 82 M112 88 L114 85" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

    <ellipse cx="132" cy="94" rx="4" ry="5.5" fill="#18181B"/>
    <circle cx="133.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
    <!-- Eyelashes -->
    <path d="M128 88 L126 85 M132 86 L132 82 M136 88 L138 85" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M102 83 Q109 78 115 82" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M125 82 Q131 78 138 83" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M117 99 Q120 104 123 99" fill="none" stroke="#42250E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bright Smile -->
    <path d="M109 110 Q120 122 131 110" fill="#E11D48" stroke="#18181B" stroke-width="2.5"/>
    <path d="M112 110 Q120 114 128 110" fill="#FFFFFF"/>

