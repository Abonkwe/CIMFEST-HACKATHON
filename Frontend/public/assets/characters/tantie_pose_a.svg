    <ellipse cx="98" cy="104" rx="4" ry="2.5" fill="#F43F5E" fill-opacity="0.4"/>
    <ellipse cx="142" cy="104" rx="4" ry="2.5" fill="#F43F5E" fill-opacity="0.4"/>

    <!-- Headwrap / Gele (African Fabric) -->
    <path d="M88 84 C85 50 100 35 120 35 C140 35 155 50 152 84 C158 75 168 60 162 48 C150 24 90 24 78 48 C72 60 82 75 88 84 Z" fill="#FACC15" stroke="#18181B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Gele Fan Knot Top -->
    <path d="M105 38 C95 18 145 18 135 38 Z" fill="#F43F5E" stroke="#18181B" stroke-width="2.5"/>
    <path d="M92 65 Q120 52 148 65" stroke="#059669" stroke-width="3.5"/>
    <circle cx="120" cy="48" r="4" fill="#536D56"/>
