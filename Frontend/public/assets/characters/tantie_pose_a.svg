    <path d="M64 225 Q120 240 176 225" stroke="#F43F5E" stroke-width="4" stroke-dasharray="10 6"/>
    <circle cx="120" cy="175" r="9" fill="#FACC15" stroke="#18181B" stroke-width="2"/>
