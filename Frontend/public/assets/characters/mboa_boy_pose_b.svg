<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" fill="none">
  <!-- Mboa Boy - Pose B: High Energy Bounce & Pop -->
  <g class="character-mboa-boy pose-b">
    <!-- Floor Shadow (tighter, airborne feel) -->
    <ellipse cx="120" cy="305" rx="46" ry="8" fill="#000000" fill-opacity="0.25"/>
    
    <!-- Street Kicks (High Bounce position) -->
    <!-- Left Sneaker (Tilted) -->
    <path d="M76 284 C74 276 86 272 96 275 L97 291 C95 297 76 297 76 284 Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5"/>
    <path d="M76 289 L96 289" stroke="#F43F5E" stroke-width="3"/>
    
    <!-- Right Sneaker (Tilted) -->
    <path d="M144 275 C154 272 166 276 164 284 C164 297 145 297 143 291 L144 275 Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5"/>
    <path d="M144 289 L164 289" stroke="#F43F5E" stroke-width="3"/>

    <!-- Jogger Pants (lifted slightly) -->
    <path d="M84 194 L78 276 L98 276 L108 204 Z" fill="#1E293B" stroke="#18181B" stroke-width="2.5"/>
    <path d="M156 194 L162 276 L142 276 L132 204 Z" fill="#1E293B" stroke="#18181B" stroke-width="2.5"/>
    <rect x="78" y="271" width="20" height="5" rx="2" fill="#0F172A"/>
    <rect x="142" y="271" width="20" height="5" rx="2" fill="#0F172A"/>

    <!-- Oversized Streetwear Hoodie (Emerald Green) -->
    <path d="M75 134 C68 159 72 199 76 209 C95 214 145 214 164 209 C168 199 172 159 165 134 Z" fill="#059669" stroke="#18181B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M92 179 C92 169 148 169 148 179 L145 202 C135 206 105 206 95 202 Z" fill="#047857" stroke="#18181B" stroke-width="2"/>
    <!-- Hoodie Strings swinging -->
    <path d="M110 136 Q105 152 108 162" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M128 136 Q135 152 132 162" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Gold Chain swinging right -->
    <path d="M102 130 Q125 154 140 132" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="126,152 128,157 133,157 129,160 131,165 126,162 121,165 123,160 119,157 124,157" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>

    <!-- Left Arm (Popped up flex) -->
    <path d="M75 136 Q50 110 46 88 Q56 80 65 92" fill="none" stroke="#543217" stroke-width="12" stroke-linecap="round"/>
    <path d="M75 136 Q50 110 46 88 Q56 80 65 92" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M75 134 Q62 120 56 106" stroke="#059669" stroke-width="15" stroke-linecap="round"/>

    <!-- Right Arm (Popped up flex / dab angle) -->
    <path d="M165 136 Q190 110 194 88 Q184 80 175 92" fill="none" stroke="#543217" stroke-width="12" stroke-linecap="round"/>
    <path d="M165 136 Q190 110 194 88 Q184 80 175 92" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M165 134 Q178 120 184 106" stroke="#059669" stroke-width="15" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="112" y="112" width="16" height="24" fill="#543217" stroke="#18181B" stroke-width="2"/>

    <!-- Head (tilted -4 deg for rhythm groove) -->
    <g transform="rotate(-4 120 88)">
      <circle cx="120" cy="88" r="30" fill="#543217" stroke="#18181B" stroke-width="3"/>
      
      <!-- Ears -->
      <circle cx="90" cy="88" r="6" fill="#543217" stroke="#18181B" stroke-width="2"/>
      <circle cx="150" cy="88" r="6" fill="#543217" stroke="#18181B" stroke-width="2"/>
      <circle cx="90" cy="90" r="1.8" fill="#F59E0B"/>

      <!-- Retro Cool Black Sunglasses / Shades -->
      <rect x="94" y="80" width="22" height="15" rx="3" fill="#0F172A" stroke="#18181B" stroke-width="2"/>
      <rect x="124" y="80" width="22" height="15" rx="3" fill="#0F172A" stroke="#18181B" stroke-width="2"/>
      <path d="M116 84 L124 84" stroke="#F59E0B" stroke-width="2.5"/>
      <path d="M98 82 L104 94" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M128 82 L134 94" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M118 97 Q120 101 122 97" stroke="#3D2109" stroke-width="2" stroke-linecap="round"/>

      <!-- Big Hype Grin with Teeth -->
      <path d="M110 104 Q120 118 130 104 Z" fill="#E11D48" stroke="#18181B" stroke-width="2"/>
      <path d="M112 104 Q120 110 128 104" fill="#FFFFFF"/>

      <!-- Backward Snapback Cap -->
      <ellipse cx="120" cy="62" rx="34" ry="12" fill="#1E293B" stroke="#18181B" stroke-width="2.5"/>
      <path d="M92 72 C90 44 150 44 148 72 Z" fill="#0F172A" stroke="#18181B" stroke-width="2.5"/>
      <path d="M110 70 Q120 64 130 70" stroke="#94A3B8" stroke-width="2.5"/>
      <rect x="113" y="52" width="4.5" height="7" fill="#059669"/>
      <rect x="117.5" y="52" width="4.5" height="7" fill="#DC2626"/>
      <rect x="122" y="52" width="4.5" height="7" fill="#FACC15"/>
    </g>
  </g>
</svg>
